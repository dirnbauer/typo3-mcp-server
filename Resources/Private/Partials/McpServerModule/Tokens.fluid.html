<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:if condition="{tokens}">
    <f:then>
        <f:variable name="tokenCount" value="{tokens -> f:count()}" />
        <div class="table-fit">
            <table class="table table-striped table-hover" id="mcp-tokens-table">
                <caption class="visually-hidden"><f:translate id="tokens.caption" domain="mcp_server.mod" /></caption>
                <thead>
                    <tr>
                        <th scope="col"><f:translate id="tokens.clientName" domain="mcp_server.mod" /></th>
                        <th scope="col"><f:translate id="tokens.created" domain="mcp_server.mod" /></th>
                        <th scope="col"><f:translate id="tokens.lastUsed" domain="mcp_server.mod" /></th>
                        <th scope="col"><f:translate id="tokens.expires" domain="mcp_server.mod" /></th>
                        <th scope="col" class="col-control"><span class="visually-hidden"><f:translate id="tokens.actions" domain="mcp_server.mod" /></span></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{tokens}" as="token">
                        <tr data-token-id="{token.uid}">
                            <th scope="row">{token.clientName}</th>
                            <td><time datetime="{token.createdIso}">{token.created}</time></td>
                            <td>
                                <f:if condition="{token.lastUsedIso}">
                                    <f:then><time datetime="{token.lastUsedIso}">{token.lastUsed}</time></f:then>
                                    <f:else><span class="text-muted">{token.lastUsed}</span></f:else>
                                </f:if>
                            </td>
                            <td><time datetime="{token.expiresIso}">{token.expires}</time></td>
                            <td class="col-control">
                                <f:variable name="revokeLabel"><f:translate id="tokens.revokeNamed" domain="mcp_server.mod" arguments="{name: token.clientName}" /></f:variable>
                                <button
                                    type="button"
                                    class="btn btn-default"
                                    data-mcp-action="revoke-token"
                                    data-token-id="{token.uid}"
                                    data-token-name="{token.clientName}"
                                    title="{revokeLabel}"
                                    aria-label="{revokeLabel}"
                                >
                                    <core:icon identifier="actions-delete" size="small" />
                                    <f:translate id="tokens.revoke" domain="mcp_server.mod" />
                                </button>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4"><f:translate id="tokens.count" domain="mcp_server.mod" arguments="{count: tokenCount}" /></td>
                        <td class="col-control">
                            <button type="button" class="btn btn-danger" data-mcp-action="revoke-all-tokens">
                                <f:translate id="tokens.revokeAll" domain="mcp_server.mod" />
                            </button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </f:then>
    <f:else>
        <f:be.infobox
            state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
            title="{f:translate(id: 'tokens.empty.title', domain: 'mcp_server.mod')}"
        >
            <p><f:translate id="tokens.empty.message" domain="mcp_server.mod" /></p>
            <button type="button" class="btn btn-primary" data-mcp-action="create-token">
                <core:icon identifier="actions-plus" size="small" />
                <f:translate id="tokens.create" domain="mcp_server.mod" />
            </button>
        </f:be.infobox>
    </f:else>
</f:if>

</html>
