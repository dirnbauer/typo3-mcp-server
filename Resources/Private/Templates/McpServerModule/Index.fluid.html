<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Before">
    <f:asset.module identifier="@typo3/backend/tab.js" />
    <f:asset.module identifier="@typo3/backend/copy-to-clipboard.js" />
    <f:asset.module identifier="@typo3/backend/utility/collapse-state-persister.js" />
    <f:asset.module identifier="@hn/mcp-server/mcp-module.js" />
</f:section>

<f:section name="Content">
    <div class="mcp-module" data-mcp-module data-csrf-token="{csrfToken}">
        <h1><f:translate id="title" domain="mcp_server.modules.mcp_server" /></h1>
        <p><f:translate id="page.intro" domain="mcp_server.mod" /></p>

        <div class="visually-hidden" role="status" aria-live="polite" data-mcp-live-region></div>

        <div class="tab-wrapper">
            <ul class="nav nav-tabs" role="tablist" id="mcp-module-tabs" data-store-last-tab aria-label="{f:translate(id: 'tab.list', domain: 'mcp_server.mod')}">
                <li role="presentation" class="nav-item">
                    <button type="button" id="mcp-tab-setup-tab" class="nav-link active" data-typo3-tab="#mcp-tab-setup" aria-controls="mcp-tab-setup" aria-selected="true" tabindex="0" role="tab">
                        <f:translate id="tab.setup" domain="mcp_server.mod" />
                    </button>
                </li>
                <li role="presentation" class="nav-item">
                    <button type="button" id="mcp-tab-tokens-tab" class="nav-link" data-typo3-tab="#mcp-tab-tokens" aria-controls="mcp-tab-tokens" aria-selected="false" tabindex="-1" role="tab">
                        <f:translate id="tab.tokens" domain="mcp_server.mod" />
                        <span class="badge badge-default" data-mcp-token-count>{tokens -> f:count()}</span>
                    </button>
                </li>
                <li role="presentation" class="nav-item">
                    <button type="button" id="mcp-tab-check-tab" class="nav-link" data-typo3-tab="#mcp-tab-check" aria-controls="mcp-tab-check" aria-selected="false" tabindex="-1" role="tab">
                        <f:translate id="tab.connectionCheck" domain="mcp_server.mod" />
                        <span data-mcp-check-badge>
                            <f:render section="checkBadge" arguments="{status: diagnostics.overallStatus}" />
                        </span>
                    </button>
                </li>
                <li role="presentation" class="nav-item">
                    <button type="button" id="mcp-tab-tools-tab" class="nav-link" data-typo3-tab="#mcp-tab-tools" aria-controls="mcp-tab-tools" aria-selected="false" tabindex="-1" role="tab">
                        <f:translate id="tab.tools" domain="mcp_server.mod" />
                        <span class="badge badge-default">{tools -> f:count()}</span>
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <div role="tabpanel" class="tab-pane active" id="mcp-tab-setup" aria-labelledby="mcp-tab-setup-tab" tabindex="-1">
                    <f:render section="setup" arguments="{_all}" />
                </div>
                <div role="tabpanel" class="tab-pane" id="mcp-tab-tokens" aria-labelledby="mcp-tab-tokens-tab" tabindex="-1">
                    <f:render section="tokens" arguments="{_all}" />
                </div>
                <div role="tabpanel" class="tab-pane" id="mcp-tab-check" aria-labelledby="mcp-tab-check-tab" tabindex="-1">
                    <f:render section="connectionCheck" arguments="{_all}" />
                </div>
                <div role="tabpanel" class="tab-pane" id="mcp-tab-tools" aria-labelledby="mcp-tab-tools-tab" tabindex="-1">
                    <f:render section="tools" arguments="{_all}" />
                </div>
            </div>
        </div>
    </div>
</f:section>

<f:section name="checkBadge">
    <f:switch expression="{status}">
        <f:case value="error"><span class="badge badge-danger"><f:translate id="diagnostic.status.error" domain="mcp_server.mod" /></span></f:case>
        <f:case value="warning"><span class="badge badge-warning"><f:translate id="diagnostic.status.warning" domain="mcp_server.mod" /></span></f:case>
        <f:defaultCase></f:defaultCase>
    </f:switch>
</f:section>

<f:section name="setup">
    <div class="form-section">
        <f:if condition="{diagnostics.overallStatus} == 'error'">
            <f:be.infobox
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::ERROR')}"
                title="{f:translate(id: 'notReady.title', domain: 'mcp_server.mod')}"
            >
                <p><f:translate id="notReady.message" domain="mcp_server.mod" /></p>
                <button type="button" class="btn btn-default" data-mcp-action="open-tab" data-mcp-tab="#mcp-tab-check">
                    <f:translate id="notReady.action" domain="mcp_server.mod" />
                </button>
            </f:be.infobox>
        </f:if>

        <h2 class="form-section-headline"><f:translate id="setup.serverUrl.heading" domain="mcp_server.mod" /></h2>
        <div class="form-group">
            <label for="mcp-server-url" class="form-label">
                <f:translate id="setup.serverUrl.label" domain="mcp_server.mod" />
            </label>
            <div class="input-group">
                <input type="text" id="mcp-server-url" class="form-control font-monospace" value="{endpointUrl}" readonly aria-describedby="mcp-server-url-hint" />
                <typo3-copy-to-clipboard text="{endpointUrl}" class="btn btn-default">
                    <core:icon identifier="actions-clipboard" size="small" />
                    <f:translate id="setup.serverUrl.copy" domain="mcp_server.mod" />
                </typo3-copy-to-clipboard>
            </div>
            <p class="form-text" id="mcp-server-url-hint">
                <f:translate id="setup.serverUrl.hint" domain="mcp_server.mod" />
            </p>
        </div>

        <f:if condition="{isLocalhost}">
            <f:be.infobox
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
                title="{f:translate(id: 'setup.localhost.title', domain: 'mcp_server.mod')}"
            >
                <p><f:translate id="setup.localhost.message" domain="mcp_server.mod" /></p>
            </f:be.infobox>
        </f:if>
    </div>

    <div class="form-section">
        <h2 class="form-section-headline"><f:translate id="setup.clients.heading" domain="mcp_server.mod" /></h2>
        <p class="form-section-description"><f:translate id="setup.clients.intro" domain="mcp_server.mod" /></p>

        <div class="panel-group" id="mcp-clients">
            <f:render section="clientPanel" arguments="{id: 'mcp-client-claude', titleId: 'claude.title', expanded: 1}" contentAs="body">
                <f:render section="clientClaude" arguments="{_all}" />
            </f:render>
            <f:render section="clientPanel" arguments="{id: 'mcp-client-cursor', titleId: 'cursor.title', expanded: 0}" contentAs="body">
                <f:render section="clientCursor" arguments="{_all}" />
            </f:render>
            <f:render section="clientPanel" arguments="{id: 'mcp-client-codex', titleId: 'codex.title', expanded: 0}" contentAs="body">
                <f:render section="clientCodex" arguments="{_all}" />
            </f:render>
        </div>
    </div>
</f:section>

<f:section name="clientPanel">
    <div class="panel panel-default">
        <div class="panel-heading">
            <div class="panel-heading-row">
                <button
                    class="panel-button{f:if(condition: expanded, else: ' collapsed')}"
                    type="button"
                    id="{id}-toggle"
                    data-bs-toggle="collapse"
                    data-bs-target="#{id}"
                    aria-controls="{id}"
                    aria-expanded="{f:if(condition: expanded, then: 'true', else: 'false')}"
                >
                    <span class="panel-title"><f:translate id="{titleId}" domain="mcp_server.mod" /></span>
                    <span class="caret"></span>
                </button>
            </div>
        </div>
        <div id="{id}" class="panel-collapse collapse{f:if(condition: expanded, then: ' show')}" data-persist-collapse-state="true" role="region" aria-labelledby="{id}-toggle">
            <div class="panel-body">
                {body -> f:format.raw()}
            </div>
        </div>
    </div>
</f:section>

<f:section name="clientClaude">
    <p><f:translate id="claude.description" domain="mcp_server.mod" /></p>
    <ol>
        <li><f:translate id="claude.step1" domain="mcp_server.mod" /></li>
        <li><f:translate id="claude.step2" domain="mcp_server.mod" /></li>
        <li><f:translate id="claude.step3" domain="mcp_server.mod" arguments="{name: siteName}" /></li>
        <li><f:translate id="claude.step4" domain="mcp_server.mod" arguments="{url: endpointUrl}" /></li>
        <li><f:translate id="claude.step5" domain="mcp_server.mod" /></li>
    </ol>
    <p class="text-muted mb-0"><f:translate id="claude.hint" domain="mcp_server.mod" /></p>
</f:section>

<f:section name="clientCursor">
    <p><f:translate id="cursor.description" domain="mcp_server.mod" /></p>
    <p>
        <a class="btn btn-primary" href="{cursorInstallUrl}" target="_top">
            <core:icon identifier="actions-plus" size="small" />
            <f:translate id="cursor.install" domain="mcp_server.mod" />
        </a>
    </p>
    <f:render section="configBlock" arguments="{
        id: 'mcp-config-cursor',
        labelId: 'cursor.config',
        copyId: 'cursor.copyConfig',
        value: cursorConfigJson,
        rows: 12
    }" />
    <p class="text-muted mb-0"><f:translate id="local.note" domain="mcp_server.mod" /></p>
</f:section>

<f:section name="clientCodex">
    <p><f:translate id="codex.description" domain="mcp_server.mod" /></p>
    <f:render section="configBlock" arguments="{
        id: 'mcp-config-codex',
        labelId: 'codex.config',
        copyId: 'codex.copyConfig',
        value: codexConfigToml,
        rows: 6
    }" />
    <p class="text-muted"><f:translate id="codex.restartHint" domain="mcp_server.mod" /></p>
    <p class="text-muted mb-0"><f:translate id="local.note" domain="mcp_server.mod" /></p>
</f:section>

<f:section name="configBlock">
    <div class="form-group">
        <label for="{id}" class="form-label"><f:translate id="{labelId}" domain="mcp_server.mod" /></label>
        <textarea id="{id}" class="form-control font-monospace" rows="{rows}" readonly spellcheck="false">{value}</textarea>
    </div>
    <p>
        <typo3-copy-to-clipboard text="{value}" class="btn btn-default">
            <core:icon identifier="actions-clipboard" size="small" />
            <f:translate id="{copyId}" domain="mcp_server.mod" />
        </typo3-copy-to-clipboard>
    </p>
</f:section>

<f:section name="tokens">
    <div class="form-section">
        <h2 class="form-section-headline"><f:translate id="tokens.heading" domain="mcp_server.mod" /></h2>
        <p class="form-section-description"><f:translate id="tokens.description" domain="mcp_server.mod" /></p>
        <div id="mcp-tokens" data-mcp-tokens>
            <f:render partial="McpServerModule/Tokens" arguments="{tokens: tokens}" />
        </div>
    </div>
</f:section>

<f:section name="connectionCheck">
    <div class="form-section">
        <h2 class="form-section-headline"><f:translate id="diagnostic.heading" domain="mcp_server.mod" /></h2>
        <p class="form-section-description"><f:translate id="diagnostic.intro" domain="mcp_server.mod" /></p>
        <p>
            <button type="button" class="btn btn-default" data-mcp-action="refresh-diagnostics">
                <core:icon identifier="actions-refresh" size="small" />
                <f:translate id="diagnostic.refresh" domain="mcp_server.mod" />
            </button>
        </p>
        <div id="mcp-diagnostics" data-mcp-diagnostics>
            <f:render partial="McpServerModule/Diagnostics" arguments="{diagnostics: diagnostics, hasWorkspace: hasWorkspace, createWorkspaceUrl: createWorkspaceUrl}" />
        </div>
    </div>
</f:section>

<f:section name="tools">
    <div class="form-section">
        <h2 class="form-section-headline"><f:translate id="tools.heading" domain="mcp_server.mod" /></h2>
        <p class="form-section-description"><f:translate id="tools.intro" domain="mcp_server.mod" /></p>
        <f:if condition="{tools}">
            <f:then>
                <div class="form-group">
                    <label for="mcp-tool-filter" class="form-label"><f:translate id="tools.filter.label" domain="mcp_server.mod" /></label>
                    <input
                        type="search"
                        id="mcp-tool-filter"
                        class="form-control"
                        placeholder="{f:translate(id: 'tools.filter.placeholder', domain: 'mcp_server.mod')}"
                        autocomplete="off"
                        data-mcp-tool-filter
                    />
                </div>
                <div class="table-fit">
                    <table class="table table-striped table-hover" id="mcp-tools-table">
                        <caption class="visually-hidden"><f:translate id="tools.caption" domain="mcp_server.mod" /></caption>
                        <thead>
                            <tr>
                                <th scope="col"><f:translate id="tools.col.name" domain="mcp_server.mod" /></th>
                                <th scope="col"><f:translate id="tools.col.description" domain="mcp_server.mod" /></th>
                                <th scope="col"><f:translate id="tools.col.effect" domain="mcp_server.mod" /></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{tools}" as="tool">
                                <tr data-mcp-tool="{tool.search}">
                                    <td class="text-nowrap"><code>{tool.name}</code></td>
                                    <td>{tool.description}</td>
                                    <td class="text-nowrap">
                                        <f:if condition="{tool.readOnly}">
                                            <f:then><span class="badge badge-success"><f:translate id="tools.readOnly" domain="mcp_server.mod" /></span></f:then>
                                            <f:else><span class="badge badge-warning"><f:translate id="tools.writes" domain="mcp_server.mod" /></span></f:else>
                                        </f:if>
                                        <f:if condition="{tool.adminOnly}">
                                            <span class="badge badge-danger"><f:translate id="tools.adminOnly" domain="mcp_server.mod" /></span>
                                        </f:if>
                                        <f:if condition="{tool.devSiteOnly}">
                                            <span class="badge badge-info"><f:translate id="tools.devSiteOnly" domain="mcp_server.mod" /></span>
                                        </f:if>
                                    </td>
                                </tr>
                            </f:for>
                            <tr data-mcp-tool-empty hidden>
                                <td colspan="3"><f:translate id="tools.noMatch" domain="mcp_server.mod" /></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <f:be.infobox
                    state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
                    title="{f:translate(id: 'tools.empty.title', domain: 'mcp_server.mod')}"
                >
                    <p><f:translate id="tools.empty.message" domain="mcp_server.mod" /></p>
                </f:be.infobox>
            </f:else>
        </f:if>
    </div>
</f:section>

</html>
